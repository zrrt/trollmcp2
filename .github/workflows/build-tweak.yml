# 云端编译 Tweak（免费 macOS runner + theos）
# 用法：把工程放进 tweaks/<name>/（Makefile + Tweak.x + <name>.plist），
#       Actions → 选本 workflow → Run workflow → 填 tweak 目录名 → 下载 .deb/.dylib
# 产物：tweak-<name>.zip（含 .theos/obj/debug/*.dylib 与 packages/*.deb）
# 注：无需越狱、无需手机工具链，编译发生在 GitHub 云端。

name: build-tweak

on:
  workflow_dispatch:
    inputs:
      tweak:
        description: 'Tweak 目录名（tweaks/<name>）'
        required: true
        default: 'CompileProbe'

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install theos + deps
        run: |
          # 优先用 runner 预装的 /opt/theos（避免 git clone 网络不稳）；缺 dm.pl 则补齐
          if [ -d /opt/theos/makefiles ]; then
            echo "使用预装 theos: /opt/theos"
            THEOS=/opt/theos
          else
            echo "下载 theos"
            mkdir -p "$HOME/theos"
            curl -sL --retry 5 https://codeload.github.com/theos/theos/tar.gz/refs/heads/master -o /tmp/theos.tar.gz
            tar -xzf /tmp/theos.tar.gz -C "$HOME/theos" --strip-components=1
            THEOS="$HOME/theos"
          fi
          # 复用 runner 自带 Xcode 的 iOS SDK（免下载几 GB）
          mkdir -p "$THEOS/sdks" "$THEOS/bin"
          if [ ! -e "$THEOS/sdks/iPhoneOS17.5.sdk" ]; then
            ln -s "$(xcrun --sdk iphoneos --show-sdk-path)" "$THEOS/sdks/iPhoneOS17.5.sdk"
          fi
          # theos 只把 $THEOS/bin 加入 PATH，dm.pl（deb 打包）必须在 bin/ 下
          if [ ! -e "$THEOS/bin/dm.pl" ]; then
            curl -sL --retry 5 https://raw.githubusercontent.com/theos/theos/master/vendor/dm.pl -o "$THEOS/vendor/dm.pl"
            chmod +x "$THEOS/vendor/dm.pl"
            cp "$THEOS/vendor/dm.pl" "$THEOS/bin/dm.pl"
            chmod +x "$THEOS/bin/dm.pl"
          fi
          brew install ldid dpkg >/dev/null 2>&1 || true
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"

      - name: Build tweak (${{ inputs.tweak }})
        working-directory: tweaks/${{ inputs.tweak }}
        run: |
          export THEOS="$THEOS"
          export THEOS_PACKAGE_SCHEME=rootless
          make package

      - name: Verify artifacts
        working-directory: tweaks/${{ inputs.tweak }}
        run: |
          ls -lh .theos/obj/debug/ 2>/dev/null || true
          ls -lh packages/ 2>/dev/null || true
          file .theos/obj/debug/*.dylib 2>/dev/null || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tweak-${{ inputs.tweak }}
          path: |
            tweaks/${{ inputs.tweak }}/.theos/obj/debug/*.dylib
            tweaks/${{ inputs.tweak }}/packages/*.deb
          if-no-files-found: error
