# 云端编译 Tweak（免费 macOS runner + theos）
# 用法：把工程放进 tweaks/<name>/（Makefile + Tweak.x + <name>.plist），
#       Actions → 选本 workflow → Run workflow → 填 tweak 目录名 → 下载 .deb/.dylib
# 产物：tweak-<name>.zip（含 .theos/obj/debug/*.dylib 与 packages/*.deb）
# 注：无需越狱、无需手机工具链，编译发生在 GitHub 云端。

name: build-tweak

on:
  workflow_dispatch:
    inputs:
      tweak:
        description: 'Tweak 目录名（tweaks/<name>）'
        required: true
        default: 'CompileProbe'

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      # 用 GitHub 官方 checkout 通道克隆完整 theos（比 git clone/curl 稳，且自带 bin/dm.pl）
      - name: Checkout theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          path: theos
          fetch-depth: 1

      - name: Prepare theos SDK
        run: |
          export THEOS="$GITHUB_WORKSPACE/theos"
          mkdir -p "$THEOS/sdks"
          # 复用 runner 自带 Xcode 的 iOS SDK（免下载几 GB）
          ln -s "$(xcrun --sdk iphoneos --show-sdk-path)" "$THEOS/sdks/iPhoneOS17.5.sdk"
          ls -l "$THEOS/bin/dm.pl" "$THEOS/sdks/"
          brew install ldid dpkg >/dev/null 2>&1 || true
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"

      - name: Build tweak (${{ inputs.tweak }})
        working-directory: tweaks/${{ inputs.tweak }}
        run: |
          export THEOS="$THEOS"
          export THEOS_PACKAGE_SCHEME=rootless
          make package

      - name: Verify artifacts
        working-directory: tweaks/${{ inputs.tweak }}
        run: |
          ls -lh .theos/obj/debug/ 2>/dev/null || true
          ls -lh packages/ 2>/dev/null || true
          file .theos/obj/debug/*.dylib 2>/dev/null || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tweak-${{ inputs.tweak }}
          path: |
            tweaks/${{ inputs.tweak }}/.theos/obj/debug/*.dylib
            tweaks/${{ inputs.tweak }}/packages/*.deb
          if-no-files-found: error
