# P1: VpnTunnel appex —— Xcode 标准 app-extension 形态（对照 Fuck 1.8.5 / socksguard）
# 关键：Xcode 对 app-extension target 自动 -e _NSExtensionMain 布线 + 生成标准扩展 Mach-O
#   （LC_MAIN→stub→non-lazy GOT→_NSExtensionMain，无 __swift5_entry、无用户 main）。
#   这就是 Fuck 能跑而 SwiftPM 直编产物被 NE 拒载的形态差异。构建=无签名，
#   build_appex.sh 用 ldid-procursus 后签名 + grep 校验 entitlements。
# Step B：在标准扩展形态上集成 hev 转发内核——Socks5Server(Sources/Socks5Server/) +
#   CHev(CHev/) 桥接层 + libhev-socks5-tunnel.a(../hev-stage/lib, build_appex.sh 下载)。
#   Bridging.h 把 CHev.h 暴露给 Swift（hev_* 函数 + utun 需要的 ctl_info/sockaddr_ctl/CTLIOCGINFO）。
name: VpnTunnelX
options:
  bundleIdPrefix: com.trollagent
  deploymentTarget:
    iOS: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  VpnTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/VpnTunnel
      - path: Sources/Socks5Server/Socks5Server.swift
      - path: Sources/Socks5Server/CaptureDB.swift
      - path: CHev/CHev.c
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.trollagent.app.VpnTunnel
        INFOPLIST_FILE: Sources/VpnTunnel/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        # Step B: 链接 hev 静态库（-ObjC 拉入所有成员），搜索路径指向 ../hev-stage/lib
        # fix3cy33: 加 -lsqlite3（系统稳定 dylib），用于结构化抓包存储(CaptureDB)。
        OTHER_LDFLAGS: "-ObjC -lhev-socks5-tunnel -lsqlite3"
        HEADER_SEARCH_PATHS: "$(inherited) CHev/include"
        LIBRARY_SEARCH_PATHS: "$(inherited) ../hev-stage/lib"
        SWIFT_OBJC_BRIDGING_HEADER: Sources/VpnTunnel/Bridging.h
        GCC_PREPROCESSOR_DEFINITIONS: "$(inherited) MINIMAL_XCODE_APPEX=1"
